services:
  tdarr:
    container_name: tdarr
    image: ghcr.io/haveagitgat/tdarr:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Zurich"
      UMASK: "0002"
      serverIP: "0.0.0.0"
      serverPort: "8266"
      webUIPort: "8265"
      internalNode: "true"
      nodeID: "Tdarr_Server"
    ports:
      - protocol: tcp
        published: "8265"
        target: 8265
      - protocol: tcp
        published: "8266"
        target: 8266
    volumes:
      - source: /DATA/Media/media
        target: /data/media
        type: bind
      - source: /DATA/AppData/$AppID/config/server
        target: /app/server
        type: bind
      - source: /DATA/AppData/$AppID/config/configs
        target: /app/configs
        type: bind
      - source: /DATA/AppData/$AppID/config/logs
        target: /app/logs
        type: bind
      - source: /DATA/AppData/$AppID/config/temp
        target: /temp
        type: bind
    network_mode: bridge
x-casaos:
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/tdarr.png
  id: mediastack-tdarr
  index: /
  main: tdarr
  port_map: "8265"
  scheme: http
  title:
    en_US: Tdarr
    custom: Tdarr
  category: MediaStack
  hostname: ""
