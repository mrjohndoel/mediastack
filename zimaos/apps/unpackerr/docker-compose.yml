services:
  unpackerr:
    container_name: unpackerr
    image: golift/unpackerr:latest
    restart: unless-stopped
    user: "1000:1000"
    environment:
      UMASK: "0002"
      TZ: "Europe/Zurich"
      UN_INTERVAL: "2m"
      UN_START_DELAY: "1m"
      UN_RETRY_DELAY: "5m"
      UN_MAX_RETRIES: "3"
      UN_PARALLEL: "1"
      UN_FILE_MODE: "0644"
      UN_DIR_MODE: "2755"
      UN_LOG_FILE: "/config/unpackerr.log"
      UN_WEBSERVER_METRICS: "true"
      UN_WEBSERVER_LISTEN_ADDR: "0.0.0.0:5656"
      UN_FOLDER_0_PATH: "/data/torrents/complete"
      UN_FOLDER_0_DELETE_AFTER: "10m"
      UN_SONARR_0_URL: "http://ZIMA_IP:8989"
      UN_SONARR_0_API_KEY: "CHANGE_ME"
      UN_SONARR_0_PATHS_0: "/data/torrents/tv"
      UN_SONARR_0_PROTOCOLS: "torrent"
      UN_SONARR_0_TIMEOUT: "10s"
      UN_SONARR_0_DELETE_DELAY: "5m"
      UN_RADARR_0_URL: "http://ZIMA_IP:7878"
      UN_RADARR_0_API_KEY: "CHANGE_ME"
      UN_RADARR_0_PATHS_0: "/data/torrents/movies"
      UN_RADARR_0_PROTOCOLS: "torrent"
      UN_RADARR_0_TIMEOUT: "10s"
      UN_RADARR_0_DELETE_DELAY: "5m"
      UN_LIDARR_0_URL: "http://ZIMA_IP:8686"
      UN_LIDARR_0_API_KEY: "CHANGE_ME"
      UN_LIDARR_0_PATHS_0: "/data/torrents/music"
      UN_LIDARR_0_PROTOCOLS: "torrent"
      UN_LIDARR_0_TIMEOUT: "10s"
      UN_LIDARR_0_DELETE_DELAY: "5m"
      UN_READARR_0_URL: "http://ZIMA_IP:8787"
      UN_READARR_0_API_KEY: "CHANGE_ME"
      UN_READARR_0_PATHS_0: "/data/torrents/books"
      UN_READARR_0_PROTOCOLS: "torrent"
      UN_READARR_0_TIMEOUT: "10s"
      UN_READARR_0_DELETE_DELAY: "5m"
      UN_MYLAR_0_URL: "http://ZIMA_IP:8090"
      UN_MYLAR_0_API_KEY: "CHANGE_ME"
      UN_MYLAR_0_PATHS_0: "/data/torrents/comics"
      UN_MYLAR_0_PROTOCOLS: "torrent"
      UN_MYLAR_0_TIMEOUT: "10s"
      UN_MYLAR_0_DELETE_DELAY: "5m"
      UN_WHISPARR_0_URL: "http://ZIMA_IP:6969"
      UN_WHISPARR_0_API_KEY: "CHANGE_ME"
      UN_WHISPARR_0_PATHS_0: "/data/torrents/xxx"
      UN_WHISPARR_0_PROTOCOLS: "torrent"
      UN_WHISPARR_0_TIMEOUT: "10s"
      UN_WHISPARR_0_DELETE_DELAY: "5m"
    ports:
      - protocol: tcp
        published: "5656"
        target: 5656
    volumes:
      - source: /DATA/AppData/$AppID/config
        target: /config
        type: bind
      - source: /DATA/Media
        target: /data
        type: bind
    network_mode: bridge
x-casaos:
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/unpackerr.png
  id: mediastack-unpackerr
  index: /metrics
  main: unpackerr
  port_map: "5656"
  scheme: http
  title:
    en_US: Unpackerr
    custom: Unpackerr
  category: MediaStack
  hostname: ""
