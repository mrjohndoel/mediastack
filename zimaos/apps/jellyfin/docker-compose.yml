services:
  jellyfin:
    container_name: jellyfin
    image: lscr.io/linuxserver/jellyfin:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Zurich"
      UMASK: "0002"
    ports:
      - protocol: tcp
        published: "8096"
        target: 8096
    volumes:
      - source: /DATA/AppData/$AppID/config
        target: /config
        type: bind
      - source: /DATA/Media/media
        target: /data/media
        type: bind
    network_mode: bridge
x-casaos:
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/jellyfin.png
  id: mediastack-jellyfin
  index: /
  main: jellyfin
  port_map: "8096"
  scheme: http
  title:
    en_US: Jellyfin
    custom: Jellyfin
  category: MediaStack
  hostname: ""
