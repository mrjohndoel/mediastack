services:
  sabnzbd:
    container_name: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Zurich"
      DOCKER_MODS: "ghcr.io/themepark-dev/theme.park:sabnzbd"
      TP_THEME: "nord"
    ports:
      - protocol: tcp
        published: "8100"
        target: 8080
    volumes:
      - source: /DATA/AppData/$AppID/config
        target: /config
        type: bind
      - source: /DATA/Media
        target: /data
        type: bind
    network_mode: bridge
x-casaos:
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/sabnzbd.png
  id: mediastack-sabnzbd
  index: /
  main: sabnzbd
  port_map: "8100"
  scheme: http
  title:
    en_US: Sabnzbd
    custom: Sabnzbd
  category: MediaStack
  hostname: ""
