services:
  whisparr:
    container_name: whisparr
    image: ghcr.io/hotio/whisparr:nightly
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Zurich"
      UMASK: "0002"
    ports:
      - protocol: tcp
        published: "6969"
        target: 6969
    volumes:
      - source: /DATA/AppData/$AppID/config
        target: /config
        type: bind
      - source: /DATA/Media
        target: /data
        type: bind
    network_mode: bridge
x-casaos:
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/whisparr.png
  id: mediastack-whisparr
  index: /
  main: whisparr
  port_map: "6969"
  scheme: http
  title:
    en_US: Whisparr
    custom: Whisparr
  category: MediaStack
  hostname: ""
