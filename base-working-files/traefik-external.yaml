#########################################################################
#########################################################################
#
# Filename: traefik-external.yaml     Traefik External Services Configuration File
#
# This file routes external requests to services running outside of MediaStack
# Replace hardcoded domains with ${CLOUDFLARE_DNS_ZONE} variables
# Update IP addresses to match your actual external service locations
#
#########################################################################
#########################################################################

http:
  routers:
    router-audiobooks-external:
      entryPoints:
        - secureweb
      rule: "Host(`audiobooks.${CLOUDFLARE_DNS_ZONE}`)"
      service: service-audiobooks-external
      tls:
        certResolver: letsencrypt
      middlewares:
        - authentik-forwardauth@file
        - security-headers@file
        - traefik-bouncer@file

    router-homepage-external:
      entryPoints:
        - secureweb
      rule: "Host(`glance.${CLOUDFLARE_DNS_ZONE}`)"
      service: service-homepage-external
